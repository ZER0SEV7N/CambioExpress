name: ci pipeline

# RN-1: cada cambio en una rama feature y cada PR hacia master se compila y se prueba
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - master

# Permisos minimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compila, ejecuta pruebas unitarias e integracion y valida la cobertura (JaCoCo)
      - name: Compilar y probar
        run: mvn -B -ntp verify

      # RN-2: los reportes se publican siempre, aunque las pruebas fallen
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
