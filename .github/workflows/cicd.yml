name: cicd pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Verify
        run: mvn -B -ntp verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cambioexpress-jar
          path: target/cambioexpress-*.jar

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: cambioexpress-jar
          path: dist

      - name: Deploy to dev
        if: ${{ secrets.DEPLOY_TOKEN != '' || vars.DEPLOY_TOKEN != '' }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN != '' && secrets.DEPLOY_TOKEN || vars.DEPLOY_TOKEN }}
        run: bash devops/desplegar.sh dev dist/cambioexpress-*.jar

  deploy-cert:
    needs: deploy-dev
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: cert
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: cambioexpress-jar
          path: dist

      - name: Deploy to cert
        if: ${{ secrets.DEPLOY_TOKEN != '' || vars.DEPLOY_TOKEN != '' }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN != '' && secrets.DEPLOY_TOKEN || vars.DEPLOY_TOKEN }}
        run: bash devops/desplegar.sh cert dist/cambioexpress-*.jar