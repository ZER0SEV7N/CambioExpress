name: cicd pipeline

# RN-4: se ejecuta a mano o con cada push a master
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Se construye el jar UNA sola vez
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y probar
        run: mvn -B -ntp verify

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: cambioexpress-jar
          path: target/cambioexpress-*.jar

  # Despliega en dev el mismo jar, sin recompilar
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - name: Descargar el codigo (script de despliegue)
        uses: actions/checkout@v4

      - name: Descargar el jar
        uses: actions/download-artifact@v4
        with:
          name: cambioexpress-jar
          path: dist

      - name: Desplegar en dev
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash devops/desplegar.sh dev dist/cambioexpress-*.jar

  # Despliega en cert el mismo jar, solo desde master
  deploy-cert:
    needs: deploy-dev
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cert
    steps:
      - name: Descargar el codigo (script de despliegue)
        uses: actions/checkout@v4

      - name: Descargar el jar
        uses: actions/download-artifact@v4
        with:
          name: cambioexpress-jar
          path: dist

      - name: Desplegar en cert
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash devops/desplegar.sh cert dist/cambioexpress-*.jar
